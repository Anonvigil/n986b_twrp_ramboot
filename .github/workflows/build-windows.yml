name: Build Windows launcher candidates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
            python: '3.9'
          - arch: x64
            runner: windows-2022
            python: '3.9'
          - arch: arm64
            runner: windows-11-arm
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run offline checks
        run: |
          python scripts/verify_public_evidence.py
          python -m unittest discover -s scripts -p "test_*.py" -v
          python scripts/ramboot.py --help
      - name: Build portable console executable
        run: python -m PyInstaller --onefile --console --clean --name N986B-TWRP-RAMBOOT scripts/ramboot.py
      - name: Fetch pinned native libusb
        shell: pwsh
        run: |
          $url = 'https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z'
          $archive = Join-Path $PWD 'dist/libusb-1.0.30.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '7FB1DFEC805B97983763D7D0AE244320DA12ADD1003D4249C96CC4D586398C79'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'libusb archive SHA-256 mismatch'
          }
          $entries = @{
            x86 = 'MinGW32/dll/libusb-1.0.dll'
            x64 = 'MinGW64/dll/libusb-1.0.dll'
            arm64 = 'VS2025/ARM64/dll/libusb-1.0.dll'
          }
          $entry = $entries['${{ matrix.arch }}']
          $extract = Join-Path $PWD 'dist/libusb-extract'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $seven = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $sevenPath = if ($seven) { $seven.Source } else { Join-Path ${env:ProgramFiles} '7-Zip/7z.exe' }
          if (!(Test-Path -LiteralPath $sevenPath)) { throw '7-Zip is required on the build runner' }
          & $sevenPath x $archive $entry "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction failed' }
          $native = Join-Path $extract $entry
          if (!(Test-Path -LiteralPath $native)) { throw 'native libusb DLL missing' }
          Copy-Item -LiteralPath $native -Destination 'dist/libusb-1.0.dll'
      - name: Smoke test executable
        run: |
          .\dist\N986B-TWRP-RAMBOOT.exe --help
          .\dist\N986B-TWRP-RAMBOOT.exe probe-usb
          Get-FileHash .\dist\N986B-TWRP-RAMBOOT.exe -Algorithm SHA256
      - name: Assemble candidate ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\release-candidate'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath 'dist\N986B-TWRP-RAMBOOT.exe','dist\libusb-1.0.dll' -Destination $stage
          Copy-Item -LiteralPath 'README.md','NOTICE.md','LICENSE','requirements-build.txt' -Destination $stage
          Copy-Item -LiteralPath 'docs','evidence','third_party' -Destination $stage -Recurse
          New-Item -ItemType Directory -Path (Join-Path $stage 'scripts') -Force | Out-Null
          Copy-Item -Path 'scripts/*.py' -Destination (Join-Path $stage 'scripts')
          $checksums = @(
            Get-FileHash -LiteralPath (Join-Path $stage 'N986B-TWRP-RAMBOOT.exe') -Algorithm SHA256
            Get-FileHash -LiteralPath (Join-Path $stage 'libusb-1.0.dll') -Algorithm SHA256
          ) | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" }
          Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Value $checksums -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath ('dist\n986b-twrp-ramboot-${{ matrix.arch }}-candidate.zip')
      - uses: actions/upload-artifact@v4
        with:
          name: n986b-twrp-ramboot-${{ matrix.arch }}-candidate
          path: dist/n986b-twrp-ramboot-${{ matrix.arch }}-candidate.zip
          if-no-files-found: error
